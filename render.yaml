# Blueprint de Render: crea el backend (Docker) y el frontend (sitio estático) desde este repositorio.
# URLs reales del despliegue: web https://opticlinic-web.onrender.com y API https://opticlinic-api-lz50.onrender.com
services:
  - type: web
    name: opticlinic-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: CORS_ORIGINS
        value: https://opticlinic-web.onrender.com

  - type: web
    name: opticlinic-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://opticlinic-api-lz50.onrender.com
