# Blueprint de Render: crea el backend (Docker) y el frontend (sitio estático) desde este repositorio.
# Si Render cambia los nombres por estar ocupados, actualiza CORS_ORIGINS y VITE_API_URL con las URLs reales.
services:
  - type: web
    name: opticlinic-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: CORS_ORIGINS
        value: https://opticlinic-web.onrender.com

  - type: web
    name: opticlinic-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://opticlinic-api.onrender.com
